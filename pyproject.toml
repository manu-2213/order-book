[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "order-book"
version = "0.1.0"
description = "Agent-based limit order book market for stealth-execution research"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib", "gymnasium"]

[project.optional-dependencies]
dev = ["pytest", "ipykernel", "imageio-ffmpeg"]

[tool.setuptools.packages.find]
include = ["order_book*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
